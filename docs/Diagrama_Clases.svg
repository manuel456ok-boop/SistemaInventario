<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1210" viewBox="0 0 1380 1210"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#50739a" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#f4f7fb"/><text x="35" y="48" fill="#192b40" font-family="Arial" font-size="26" font-weight="bold">Clases y dependencias principales</text><text x="35" y="77" fill="#53677e" font-family="Arial" font-size="14">SistemaInventario · herencia, contratos genéricos e inyección por constructor</text><rect x="40" y="120" width="390" height="153" rx="8" fill="white" stroke="#bfd0e2"/><path d="M48,120H422Q430,120 430,128V160H40V128Q40,120 48,120" fill="#192b40"/><text x="55" y="147" fill="white" font-family="Arial" font-size="16" font-weight="bold">EntidadBase (abstracta)</text><text x="55" y="185" fill="#243d58" font-family="monospace" font-size="13">Id : int</text><text x="55" y="208" fill="#243d58" font-family="monospace" font-size="13">Activo : bool</text><text x="55" y="231" fill="#243d58" font-family="monospace" font-size="13">FechaCreacion : DateTime</text><text x="55" y="254" fill="#243d58" font-family="monospace" font-size="13">FechaModificacion : DateTime</text><rect x="40" y="360" width="390" height="107" rx="8" fill="white" stroke="#bfd0e2"/><path d="M48,360H422Q430,360 430,368V400H40V368Q40,360 48,360" fill="#192b40"/><text x="55" y="387" fill="white" font-family="Arial" font-size="16" font-weight="bold">Categoria : EntidadBase</text><text x="55" y="425" fill="#243d58" font-family="monospace" font-size="13">Nombre, Descripcion : string</text><text x="55" y="448" fill="#243d58" font-family="monospace" font-size="13">Fotos : List&lt;FotoCategoria&gt;</text><rect x="40" y="535" width="390" height="107" rx="8" fill="white" stroke="#bfd0e2"/><path d="M48,535H422Q430,535 430,543V575H40V543Q40,535 48,535" fill="#192b40"/><text x="55" y="562" fill="white" font-family="Arial" font-size="16" font-weight="bold">Suplidor : EntidadBase</text><text x="55" y="600" fill="#243d58" font-family="monospace" font-size="13">Empresa, Contacto : string</text><text x="55" y="623" fill="#243d58" font-family="monospace" font-size="13">Telefono, Correo, Web : string</text><rect x="40" y="710" width="390" height="130" rx="8" fill="white" stroke="#bfd0e2"/><path d="M48,710H422Q430,710 430,718V750H40V718Q40,710 48,710" fill="#192b40"/><text x="55" y="737" fill="white" font-family="Arial" font-size="16" font-weight="bold">Producto : EntidadBase</text><text x="55" y="775" fill="#243d58" font-family="monospace" font-size="13">Nombre : string</text><text x="55" y="798" fill="#243d58" font-family="monospace" font-size="13">PrecioUnitario : decimal</text><text x="55" y="821" fill="#243d58" font-family="monospace" font-size="13">CategoriaId, SuplidorId : int</text><rect x="40" y="915" width="390" height="130" rx="8" fill="white" stroke="#bfd0e2"/><path d="M48,915H422Q430,915 430,923V955H40V923Q40,915 48,915" fill="#192b40"/><text x="55" y="942" fill="white" font-family="Arial" font-size="16" font-weight="bold">FotoCategoria : EntidadBase</text><text x="55" y="980" fill="#243d58" font-family="monospace" font-size="13">CategoriaId : int</text><text x="55" y="1003" fill="#243d58" font-family="monospace" font-size="13">NombreArchivo : string</text><text x="55" y="1026" fill="#243d58" font-family="monospace" font-size="13">Contenido : byte[]</text><rect x="500" y="120" width="390" height="130" rx="8" fill="white" stroke="#bfd0e2"/><path d="M508,120H882Q890,120 890,128V160H500V128Q500,120 508,120" fill="#192b40"/><text x="515" y="147" fill="white" font-family="Arial" font-size="16" font-weight="bold">IRepositorio&lt;T&gt; (interfaz)</text><text x="515" y="185" fill="#243d58" font-family="monospace" font-size="13">Listar / Obtener / Crear</text><text x="515" y="208" fill="#243d58" font-family="monospace" font-size="13">Actualizar / Eliminar / Restaurar</text><text x="515" y="231" fill="#243d58" font-family="monospace" font-size="13">where T : EntidadBase</text><rect x="500" y="360" width="390" height="130" rx="8" fill="white" stroke="#bfd0e2"/><path d="M508,360H882Q890,360 890,368V400H500V368Q500,360 508,360" fill="#192b40"/><text x="515" y="387" fill="white" font-family="Arial" font-size="16" font-weight="bold">RepositorioSql&lt;T&gt; (abstracta)</text><text x="515" y="425" fill="#243d58" font-family="monospace" font-size="13">Implementa IRepositorio&lt;T&gt;</text><text x="515" y="448" fill="#243d58" font-family="monospace" font-size="13">Mapeo y parámetros abstractos</text><text x="515" y="471" fill="#243d58" font-family="monospace" font-size="13">Tres repositorios especializados</text><rect x="500" y="590" width="390" height="130" rx="8" fill="white" stroke="#bfd0e2"/><path d="M508,590H882Q890,590 890,598V630H500V598Q500,590 508,590" fill="#192b40"/><text x="515" y="617" fill="white" font-family="Arial" font-size="16" font-weight="bold">EjecutorSql</text><text x="515" y="655" fill="#243d58" font-family="monospace" font-size="13">Recibe ConexionSql + ILogger</text><text x="515" y="678" fill="#243d58" font-family="monospace" font-size="13">Ejecutar&lt;T&gt;(..., accion)</text><text x="515" y="701" fill="#243d58" font-family="monospace" font-size="13">Transacción y SqlException</text><rect x="500" y="815" width="390" height="130" rx="8" fill="white" stroke="#bfd0e2"/><path d="M508,815H882Q890,815 890,823V855H500V823Q500,815 508,815" fill="#192b40"/><text x="515" y="842" fill="white" font-family="Arial" font-size="16" font-weight="bold">ConexionSql (Singleton)</text><text x="515" y="880" fill="#243d58" font-family="monospace" font-size="13">Constructor privado</text><text x="515" y="903" fill="#243d58" font-family="monospace" font-size="13">Instancia : Lazy&lt;ConexionSql&gt;</text><text x="515" y="926" fill="#243d58" font-family="monospace" font-size="13">Configurar / CrearConexion</text><rect x="960" y="120" width="380"